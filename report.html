<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>รายงาน หมูพริ้ว JLK Tower</title>
<style>
:root{--bg:#f1f3f6;--card:#fff;--line:#d5dbe3;--ink:#10161d;--muted:#586272;--accent:#b45309;--ok:#15803d;--bad:#b91c1c;--bar:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#0c1015;--card:#141a21;--line:#2a3440;--ink:#eef2f6;--muted:#8e9aa8;--accent:#fbbf24;--ok:#34d399;--bad:#f87171;--bar:#fbbf24;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Noto Sans Thai","Sarabun",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600}
input,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input{width:100%}
button{cursor:pointer}
button.p{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi small{color:var(--muted);display:block}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums}
.hours{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.hc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.hc i{display:block;width:100%;max-width:38px;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.hc span{font-size:11px;color:var(--muted);margin-top:4px}
.hc em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:13px}
.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--muted);font-size:13px}
.err{color:var(--bad);white-space:pre-wrap}
.stale{color:var(--bad);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="ttl">รายงาน หมูพริ้ว · JLK Tower</h1><span class="sp"></span>
    <input type="date" id="date" style="width:auto">
    <button id="reload">รีเฟรช</button>
    <button id="cfgBtn">ตั้งค่า</button>
  </div>

  <div class="card" id="cfg" hidden>
    <h2>เชื่อมต่อ (เก็บในเครื่องนี้เท่านั้น)</h2>
    <div class="row">
      <label>Project URL<input id="url" placeholder="https://xxxx.supabase.co" autocomplete="off"></label>
      <label>Publishable key<input id="key" placeholder="sb_publishable_..." autocomplete="off"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <label>รหัสสาขา<input id="branch" value="jlk" autocomplete="off"></label>
      <label>รหัสดูรายงาน<input id="rtoken" type="password" autocomplete="off"></label>
    </div>
    <p class="mut">รหัสดูรายงานคนละตัวกับรหัสลับของแอปมือถือ (ตั้งใน Supabase ตามไฟล์ supabase_report.sql)</p>
    <button class="p" id="save">บันทึกและดูรายงาน</button>
  </div>

  <div id="msg" class="err"></div>
  <div id="body" hidden>
    <div class="kpis">
      <div class="kpi"><small>ยอดขาย</small><b id="kTotal">฿0</b></div>
      <div class="kpi"><small>จำนวนบิล</small><b id="kBills">0</b></div>
      <div class="kpi"><small>เฉลี่ยต่อบิล</small><b id="kAvg">฿0</b></div>
      <div class="kpi"><small>บิลยกเลิก</small><b id="kVoid">0</b></div>
    </div>
    <p class="mut" id="fresh" style="margin:8px 2px"></p>
    <div class="card"><h2>ยอดรายชั่วโมง</h2><div class="hours" id="hours"></div></div>
    <div class="card" style="margin-top:12px"><h2>ช่องทางชำระเงิน</h2><table id="pays"></table></div>
    <div class="card" style="margin-top:12px"><h2>ยอดแยกรายเมนู</h2><table id="items"></table></div>
  </div>
</div>
<script src="config.js"></script>
<script src="core.js"></script>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const money=n=>'฿'+Math.round(Number(n)||0).toLocaleString('en-US');
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const LS='pos_report_cfg';
  let cfg={}, timer=null;
  const load=()=>{try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return {}}};
  const store=()=>{try{localStorage.setItem(LS,JSON.stringify(cfg))}catch(e){}};

  async function init(){
    cfg=load();
    try{ // เติม URL/key จากแอปมือถืออัตโนมัติ (เครื่องเดียวกัน)
      const s=await POS.getSettings();
      cfg.url=cfg.url||s.supabaseUrl; cfg.key=cfg.key||s.apiKey; cfg.branch=cfg.branch||s.branchId;
    }catch(e){}
    cfg.branch=cfg.branch||'jlk';
    $('#url').value=cfg.url||''; $('#key').value=cfg.key||''; $('#branch').value=cfg.branch; $('#rtoken').value=cfg.rtoken||'';
    $('#date').value=POS.bkkDate();
    if(!cfg.url||!cfg.key||!cfg.rtoken) $('#cfg').hidden=false; else run();
    clearInterval(timer); timer=setInterval(()=>{ if(!document.hidden && cfg.rtoken) run(true); },60000);
  }

  async function run(quiet){
    $('#msg').textContent=quiet?$('#msg').textContent:'กำลังโหลด…';
    try{
      const h={'Content-Type':'application/json',apikey:cfg.key};
      if(/^eyJ/.test(cfg.key)) h.Authorization='Bearer '+cfg.key;
      const res=await fetch(cfg.url.replace(/\/+$/,'')+'/rest/v1/rpc/get_report',{method:'POST',headers:h,
        body:JSON.stringify({p_branch:cfg.branch,p_report_token:cfg.rtoken,p_date:$('#date').value})});
      const txt=await res.text();
      if(!res.ok) throw new Error(res.status===403?'รหัสดูรายงานไม่ถูกต้อง (หรือยังไม่ได้ตั้งใน Supabase)':('เซิร์ฟเวอร์ตอบ '+res.status+' '+txt.slice(0,200)));
      render(JSON.parse(txt)); $('#msg').textContent='';
    }catch(e){ $('#msg').textContent='โหลดไม่สำเร็จ: '+(e.message||e); }
  }

  function render(d){
    $('#body').hidden=false;
    if(d.branch) $('#ttl').textContent='รายงาน หมูพริ้ว · '+d.branch;
    $('#kTotal').textContent=money(d.total); $('#kBills').textContent=d.bills;
    $('#kAvg').textContent=money(d.bills?d.total/d.bills:0); $('#kVoid').textContent=d.voids;
    const f=$('#fresh'); f.className='mut';
    if(d.last_received){
      const t=new Date(d.last_received), mins=Math.round((Date.now()-t)/60000);
      const hh=t.toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit'});
      const isToday=d.date===POS.bkkDate();
      f.textContent='ข้อมูลล่าสุดจากร้านเข้าระบบ '+hh+' น.'+(isToday?' ('+mins+' นาทีที่แล้ว)':'')+' · ร้านส่งข้อมูลทุกชั่วโมง ยอดอาจช้ากว่าจริงได้ไม่เกินประมาณ 1 ชม.';
      if(isToday&&mins>120) f.className='stale';
    } else f.textContent='ยังไม่มีข้อมูลของวันนี้';
    // รายชั่วโมง
    const hs=d.hourly||[]; const max=Math.max(1,...hs.map(x=>+x.amount));
    $('#hours').innerHTML=hs.length?hs.map(x=>`<div class="hc"><em>${Math.round(x.amount).toLocaleString('en-US')}</em><i style="height:${Math.max(2,(+x.amount/max)*100)}px"></i><span>${String(x.hour).padStart(2,'0')}</span></div>`).join(''):'<span class="mut">ไม่มีข้อมูล</span>';
    $('#pays').innerHTML='<tr><th>ช่องทาง</th><th class="r">บิล</th><th class="r">ยอด</th></tr>'+(d.payments||[]).map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${x.bills}</td><td class="r">${money(x.amount)}</td></tr>`).join('');
    $('#items').innerHTML='<tr><th>เมนู</th><th class="r">จาน</th><th class="r">ยอด</th></tr>'+(d.items||[]).map(x=>`<tr><td>${esc(x.name)}<div class="mut">${esc(x.code||'')} · ฿${x.price}</div></td><td class="r">${x.qty}</td><td class="r">${money(x.amount)}</td></tr>`).join('');
  }

  $('#cfgBtn').onclick=()=>{$('#cfg').hidden=!$('#cfg').hidden};
  $('#reload').onclick=()=>run();
  $('#date').onchange=()=>run();
  $('#save').onclick=()=>{cfg={url:$('#url').value.trim(),key:$('#key').value.trim(),branch:$('#branch').value.trim()||'jlk',rtoken:$('#rtoken').value};store();$('#cfg').hidden=true;run();};
  init();
})();
</script>
</body>
</html>
