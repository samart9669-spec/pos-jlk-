<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#c2410c">
<title>หมูพริ้ว POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#faf6f1; --card:#ffffff; --ink:#1f1a17; --muted:#6b625c; --line:#e6ddd3;
  --accent:#c2410c; --accent-ink:#ffffff; --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
  --key:#2b2623; --key-ink:#fff; --soft:#fff1e6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#17130f;--card:#241e19;--ink:#f5ede6;--muted:#b3a79d;--line:#3a312a;--soft:#3a2418;--key:#f5ede6;--key-ink:#17130f;--accent:#ea6a2a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
body{display:flex;flex-direction:column;overscroll-behavior:none;touch-action:manipulation;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header{flex-wrap:nowrap}
.ttl{flex:1;min-width:0}
header h1{font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#todayLine{display:block;font-size:13px;color:var(--muted);white-space:nowrap}
.pill{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad);font-weight:700}
#dummy{display:none;background:#fef3c7;color:#78350f;font-size:14px;padding:6px 14px;border-bottom:1px solid #fde68a;text-align:center}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;padding:12px 4px;font-size:16px;color:var(--muted);border-bottom:3px solid transparent}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.view{display:none;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.on{display:flex;flex-direction:column}

/* หน้าสั่ง */
#menuWrap{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 14px}
.grp{font-size:14px;color:var(--muted);margin:10px 2px 6px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{position:relative;min-height:84px;border-radius:14px;border:2px solid var(--line);background:var(--card);
  padding:10px 10px 10px 58px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px}
.item:active{transform:scale(.97)}
.item.in{border-color:var(--accent);background:var(--soft)}
.item .k{position:absolute;left:8px;top:50%;transform:translateY(-50%);min-width:40px;height:40px;padding:0 6px;border-radius:10px;
  background:var(--key);color:var(--key-ink);display:grid;place-items:center;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.item .n{font-size:17px;font-weight:700;line-height:1.2}
.item .p{font-size:14px;color:var(--muted)}
.item .q{position:absolute;right:8px;top:6px;min-width:28px;height:28px;border-radius:99px;background:var(--accent);color:var(--accent-ink);
  display:none;place-items:center;font-weight:800;font-size:15px;padding:0 7px}
.item.in .q{display:grid}

#panel{background:var(--card);border-top:2px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom));max-height:56vh;display:flex;flex-direction:column;gap:8px}
#cartEmpty{color:var(--muted);text-align:center;padding:10px 0;font-size:15px}
#cartBody{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:6px}
.crow{display:flex;align-items:center;gap:8px;font-size:16px}
.crow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .amt{width:62px;text-align:right;font-variant-numeric:tabular-nums}
.step{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:22px;line-height:1}
.qn{width:26px;text-align:center;font-weight:800}
.how{background:var(--soft);border:1px dashed var(--accent);border-radius:12px;padding:8px 10px}
.how h3{margin:0 0 5px;font-size:13px;color:var(--accent);letter-spacing:.2px}
.how ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.how li{display:flex;align-items:center;gap:3px;font-size:14px}
.how li+li::before{content:"›";color:var(--muted);margin:0 4px 0 2px;font-size:20px}
.x{font-weight:800;color:var(--accent);margin-left:2px;font-size:15px}
.kk{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:8px;background:var(--key);color:var(--key-ink);font-weight:800;font-size:18px}
.kk.e{background:#15803d;color:#fff} .kk.d{background:#1d4ed8;color:#fff} .kk.c{background:#b91c1c;color:#fff}
.how em{font-style:normal;color:var(--muted);margin-left:4px}
#pays{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pay{flex:0 0 auto;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 11px;font-size:15px;white-space:nowrap}
.pay b{margin-right:4px}
.pay.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.bar{display:flex;gap:8px;align-items:stretch}
.total{display:flex;flex-direction:column;justify-content:center;min-width:92px}
.total small{color:var(--muted);font-size:12px} .total b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
#save{flex:1;min-height:58px;border:0;border-radius:14px;background:var(--ok);color:#fff;font-size:19px;font-weight:800}
#save:disabled{background:var(--line);color:var(--muted)}
#clear{width:58px;border:2px solid var(--line);background:var(--bg);border-radius:14px;font-size:14px;color:var(--bad)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));background:#1f1a17;color:#fff;border-radius:14px;
  padding:12px 14px;display:none;align-items:center;gap:10px;z-index:9;box-shadow:0 6px 24px #0006}
#toast.on{display:flex} #toast span{flex:1;font-size:15px}
#toast button{border:1px solid #fff6;background:none;color:#fff;border-radius:10px;padding:8px 10px;font-size:14px}

/* หน้าอื่น */
.pad{padding:12px 14px 24px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h2{margin:0 0 8px;font-size:16px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row .l{flex:1;min-width:0} .row .r{font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:13px 14px;font-weight:700;font-size:16px;min-height:48px}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.bill .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.tag.ok{color:var(--ok)} .tag.w{color:var(--warn)} .tag.v{color:var(--bad);border-color:var(--bad)}
.bill.void{opacity:.55} .bill.void .sum{text-decoration:line-through}
.hours{display:flex;align-items:flex-end;gap:4px;height:80px}
.hours div{flex:1;max-width:34px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.hours small{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;user-select:text}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.sw input{width:22px;height:22px}
</style>
</head>
<body>
<header>
  <div class="ttl"><h1 id="title">หมูพริ้ว · JLK Tower</h1><small id="todayLine"></small></div>
  <span class="pill" id="netPill">…</span>
  <span class="pill" id="syncPill">…</span>
</header>
<div id="dummy">⚠️ เมนูตัวอย่าง — เลขกดเครื่องยังไม่ใช่ของจริง</div>
<nav id="tabs">
  <button data-v="order" class="on">สั่ง</button>
  <button data-v="bills">บิลวันนี้</button>
  <button data-v="sum">สรุป/ส่งออก</button>
  <button data-v="set">ตั้งค่า</button>
</nav>
<main>
  <!-- สั่ง -->
  <section class="view on" id="v-order">
    <div id="menuWrap"></div>
    <div id="panel">
      <div id="cartEmpty">แตะเมนูเพื่อเริ่มบิลใหม่ (แตะซ้ำ = เพิ่มจำนวน)</div>
      <div id="cartBody" hidden></div>
      <div class="how" id="how" hidden><h3>กดบนเครื่องคิดเงินตามนี้ (×n = กดชุดนั้นซ้ำ n ครั้ง)</h3><ol id="steps"></ol></div>
      <div id="pays"></div>
      <div class="bar">
        <button id="clear" aria-label="ล้างตะกร้า">ล้าง</button>
        <div class="total"><small>รวม</small><b id="total">฿0</b></div>
        <button id="save" disabled>กดเครื่องแล้ว · บันทึกบิล</button>
      </div>
    </div>
  </section>

  <!-- บิลวันนี้ -->
  <section class="view" id="v-bills"><div class="pad" id="billsList"></div></section>

  <!-- สรุป -->
  <section class="view" id="v-sum"><div class="pad" id="sumBody"></div></section>

  <!-- ตั้งค่า -->
  <section class="view" id="v-set"><div class="pad" id="setBody"></div></section>
</main>
<div id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
