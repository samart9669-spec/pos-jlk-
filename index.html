<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c1015">
<title>หมูพริ้ว POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
/* ผังหน้าจอ: เครื่อง POS แนวตั้ง — เมนูเป็นช่องสีแยกกลุ่ม ลำดับปุ่มกดเครื่องเป็นปุ่มจริงเรียงตามขั้น
   (แท็บเล็ตแนวนอน: เมนูซ้าย แผงบิลขวา) */
:root{
  --bg:#f1f3f6; --panel:#ffffff; --card:#ffffff; --line:#d5dbe3; --ink:#10161d; --muted:#586272;
  --accent:#b45309; --accent-ink:#ffffff; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --blue:#1d4ed8;
  --soft:#e8ecf2; --well:#e2e7ee;
  --g0:#d97706; --g1:#0d9488; --g2:#7c3aed; --g3:#e11d48;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0c1015; --panel:#141a21; --card:#1a222b; --line:#2a3440; --ink:#eef2f6; --muted:#8e9aa8;
    --accent:#fbbf24; --accent-ink:#1b1400; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --blue:#60a5fa;
    --soft:#1f2832; --well:#0f141a;
    --g0:#fbbf24; --g1:#2dd4bf; --g2:#a78bfa; --g3:#fb7185; color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#0c1015; --panel:#141a21; --card:#1a222b; --line:#2a3440; --ink:#eef2f6; --muted:#8e9aa8;
  --accent:#fbbf24; --accent-ink:#1b1400; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --blue:#60a5fa;
  --soft:#1f2832; --well:#0f141a;
  --g0:#fbbf24; --g1:#2dd4bf; --g2:#a78bfa; --g3:#fb7185; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
body{display:flex;flex-direction:column;overscroll-behavior:none;touch-action:manipulation;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.mono,.num{font-variant-numeric:tabular-nums}

/* ส่วนหัว */
header{padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px}
.ttl{flex:1;min-width:0}
header h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
#todayLine{display:block;font-size:15px;font-weight:800;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:#fff;background:var(--bad);border-color:var(--bad);font-weight:700}
#dummy{display:none;background:var(--warn);color:#1b1400;font-size:13px;font-weight:700;padding:5px 14px;text-align:center}
nav{display:flex;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:var(--soft);padding:10px 4px;font-size:15px;font-weight:600;color:var(--muted);border-radius:10px}
nav button.on{background:var(--accent);color:var(--accent-ink)}
main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.view{display:none;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.on{display:flex;flex-direction:column}

/* เมนู: ช่องสีแยกกลุ่ม */
#menuWrap{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 16px}
.grp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.6px;color:var(--muted);margin:12px 2px 8px}
.grp::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--g)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{--g:var(--g0);position:relative;min-height:112px;border-radius:14px;padding:10px 12px;text-align:left;
  display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;gap:4px 10px;align-items:start;
  background:color-mix(in srgb,var(--g) 11%,var(--card));border:2px solid color-mix(in srgb,var(--g) 40%,var(--line))}
.g1 .item,.item.g1{--g:var(--g1)} .g2 .item,.item.g2{--g:var(--g2)} .g3 .item,.item.g3{--g:var(--g3)}
.grp.g0{--g:var(--g0)} .grp.g1{--g:var(--g1)} .grp.g2{--g:var(--g2)} .grp.g3{--g:var(--g3)}
.item:active{transform:scale(.97)}
.item .n{grid-column:1/3;grid-row:2;font-size:18px;font-weight:700;line-height:1.2;margin-top:2px}
.item .p{grid-column:1/3;grid-row:3;font-size:16px;font-weight:800;color:var(--g);font-variant-numeric:tabular-nums}
.item.in{background:color-mix(in srgb,var(--g) 30%,var(--card));border-color:var(--g)}
.item .q{position:absolute;right:8px;top:8px;min-width:36px;height:36px;border-radius:99px;background:var(--g);color:#0b0f14;
  display:none;place-items:center;font-weight:900;font-size:18px;padding:0 9px;box-shadow:0 2px 6px #0005}
.item.in .q{display:grid}

/* ปุ่มกดเครื่องจริง (keycap) */
.kc{display:inline-grid;place-items:center;min-width:42px;height:42px;padding:0 9px;border-radius:9px;
  background:linear-gradient(#f5f6f8,#cfd4db);color:#10161d;font-weight:800;font-size:21px;line-height:1;
  box-shadow:0 3px 0 #6b7480,0 4px 6px #0004,inset 0 1px 0 #fff;font-variant-numeric:tabular-nums}
.kc.sm{min-width:36px;height:36px;font-size:18px;box-shadow:0 2px 0 #6b7480,0 3px 5px #0004,inset 0 1px 0 #fff}
.kc.e{background:linear-gradient(#34d27b,#16a34a);color:#fff;box-shadow:0 3px 0 #0f6b30,0 4px 6px #0004,inset 0 1px 0 #7be7a8}
.kc.d{background:linear-gradient(#5b8def,#2155d6);color:#fff;box-shadow:0 3px 0 #173a99,0 4px 6px #0004,inset 0 1px 0 #9bb8f7}
.kc.c{background:linear-gradient(#f26a6a,#d12c2c);color:#fff;box-shadow:0 3px 0 #8d1717,0 4px 6px #0004,inset 0 1px 0 #f7a3a3}

/* แผงบิล */
#panel{background:var(--panel);border-top:2px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  max-height:58vh;display:flex;flex-direction:column;gap:8px}
#cartEmpty{color:var(--muted);text-align:center;padding:12px 0;font-size:15px}
#cartBody{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:2px}
.crow{display:flex;align-items:center;gap:8px;font-size:16px;padding:3px 0}
.crow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.crow .amt{width:68px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.step{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:22px;line-height:1}
.qn{width:28px;text-align:center;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}

/* ลำดับปุ่มที่ต้องกดบนเครื่อง */
.how{background:var(--well);border:1px solid var(--line);border-radius:14px;padding:8px 10px 10px}
.how h3{margin:0 0 7px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px}
#steps{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.stp{position:relative;display:flex;flex-direction:column;gap:5px;padding:7px 9px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-width:0}
.stp .sn{position:absolute;left:-5px;top:-7px;width:20px;height:20px;border-radius:99px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:11px;font-weight:900}
.stp .row2{display:flex;align-items:center;gap:6px}
.stp .x{font-weight:900;color:var(--accent);font-size:17px}
.stp .sl{font-size:11px;color:var(--muted);max-width:132px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp.done{opacity:.32}
.stp.done::after{content:"✓";position:absolute;right:7px;bottom:3px;color:var(--ok);font-weight:900;font-size:18px}
#pays{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pay{flex:0 0 auto;border:2px solid var(--line);background:var(--soft);border-radius:10px;padding:7px 11px;font-size:15px;white-space:nowrap}
.pay b{margin-right:5px;color:var(--muted)}
.pay.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)} .pay.on b{color:inherit}
.bar{display:flex;gap:8px;align-items:stretch}
.total{display:flex;flex-direction:column;justify-content:center;min-width:104px}
.total small{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.4px}
.total b{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05}
#save{flex:1;min-height:60px;border:0;border-radius:14px;background:var(--ok);color:#06210f;font-size:19px;font-weight:900}
#save:disabled{background:var(--soft);color:var(--muted)}
#clear{width:58px;border:2px solid var(--line);background:var(--soft);border-radius:14px;font-size:14px;color:var(--bad);font-weight:700}
#toast{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));background:#0b0f14;color:#fff;border-radius:14px;
  padding:12px 14px;display:none;align-items:center;gap:10px;z-index:9;box-shadow:0 8px 28px #0008;border:1px solid #2a3440}
#toast.on{display:flex} #toast span.t{flex:1;font-size:15px}
#toast button{border:1px solid #fff6;background:none;color:#fff;border-radius:10px;padding:8px 10px;font-size:14px}

/* หน้าอื่น */
.pad{padding:12px 14px 24px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h2{margin:0 0 8px;font-size:16px}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row .l{flex:1;min-width:0} .row .r{font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:13px 14px;font-weight:800;font-size:16px;min-height:48px}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line);font-weight:600}
.bill .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.tag.ok{color:var(--ok)} .tag.w{color:var(--warn)} .tag.v{color:var(--bad);border-color:var(--bad)}
.bill.void{opacity:.55} .bill.void .sum{text-decoration:line-through}
.hours{display:flex;align-items:flex-end;gap:4px;height:80px}
.hours div{flex:1;max-width:34px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.hours small{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input,textarea{font:inherit;color:var(--ink);background:var(--well);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;user-select:text}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.sw input{width:22px;height:22px}

/* แท็บเล็ต / จอกว้าง */
@media (min-width:640px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:900px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  #v-order.on{flex-direction:row}
  #panel{width:420px;max-height:none;border-top:0;border-left:2px solid var(--line);flex:0 0 420px}
  #cartBody{flex:1}
  #cartEmpty{flex:1;display:grid;place-items:center}
  #toast{left:auto;right:16px;width:420px}
}
@media (min-width:1200px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
</style>
</head>
<body>
<header>
  <div class="ttl"><h1 id="title">หมูพริ้ว · JLK Tower</h1><small id="todayLine"></small></div>
  <span class="pill" id="netPill">…</span>
  <span class="pill" id="syncPill">…</span>
</header>
<div id="dummy">⚠️ เมนูตัวอย่าง — เลขกดเครื่องยังไม่ใช่ของจริง</div>
<nav id="tabs">
  <button data-v="order" class="on">สั่ง</button>
  <button data-v="bills">บิลวันนี้</button>
  <button data-v="sum">สรุป/ส่งออก</button>
  <button data-v="set">ตั้งค่า</button>
</nav>
<main>
  <!-- สั่ง -->
  <section class="view on" id="v-order">
    <div id="menuWrap"></div>
    <div id="panel">
      <div id="cartEmpty">แตะเมนูเพื่อเริ่มบิลใหม่ (แตะซ้ำ = เพิ่มจำนวน)</div>
      <div id="cartBody" hidden></div>
      <div class="how" id="how" hidden><h3>กดบนเครื่องตามลำดับ · ×n = กดชุดนั้นซ้ำ n ครั้ง · แตะขั้นที่กดแล้วเพื่อติ๊ก</h3><ol id="steps"></ol></div>
      <div id="pays"></div>
      <div class="bar">
        <button id="clear" aria-label="ล้างตะกร้า">ล้าง</button>
        <div class="total"><small>รวม</small><b id="total">฿0</b></div>
        <button id="save" disabled>กดเครื่องแล้ว · บันทึกบิล</button>
      </div>
    </div>
  </section>

  <!-- บิลวันนี้ -->
  <section class="view" id="v-bills"><div class="pad" id="billsList"></div></section>

  <!-- สรุป -->
  <section class="view" id="v-sum"><div class="pad" id="sumBody"></div></section>

  <!-- ตั้งค่า -->
  <section class="view" id="v-set"><div class="pad" id="setBody"></div></section>
</main>
<div id="toast"><span class="t" id="toastMsg"></span><button id="toastBtn"></button></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
